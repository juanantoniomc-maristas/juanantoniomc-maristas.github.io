<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Riego Automático</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS: Paleta de colores y variables */
        :root {
            --tierra-clara: #f4f1ea;
            --tierra-oscura: #5D4037;
            --tierra-media: #8D6E63;
            --verde-planta: #4CAF50;
            --verde-oscuro: #2E7D32;
            --azul-agua: #0288D1;
            --azul-claro: #29B6F6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--tierra-clara);
            color: var(--tierra-oscura);
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        /* Cabecera moderna */
        .cabecera {
            margin-bottom: 50px;
        }

        h1 {
            color: var(--verde-oscuro);
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }

        .subtitulo {
            color: var(--tierra-media);
            font-size: 1.1em;
            margin-top: 0;
        }

        /* Contenedor tipo cuadrícula */
        .grid-cultivos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo moderno de tarjeta */
        .tarjeta-cultivo {
            background-color: white;
            border-radius: 16px;
            overflow: hidden; /* Esto asegura que la imagen no se salga de las esquinas redondeadas */
            box-shadow: 0 10px 20px rgba(93, 64, 55, 0.08);
            transition: all 0.3s ease;
            position: relative;
        }

        /* Efecto de "flotar" al pasar el ratón */
        .tarjeta-cultivo:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(93, 64, 55, 0.15);
        }

        /* Imagen de borde a borde */
        .imagen-cultivo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        /* Contenedor para el texto y controles dentro de la tarjeta */
        .contenido-tarjeta {
            padding: 25px;
        }

        .tarjeta-cultivo h2 {
            color: var(--tierra-oscura);
            margin: 0 0 15px 0;
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--verde-planta);
            padding-bottom: 10px;
            display: inline-block;
        }

        /* Controles de formulario (Horarios) rediseñados */
        .control-horario {
            margin: 20px 0;
            text-align: left;
            background-color: #faf9f7;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #eae5d9;
        }

        .campo-tiempo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .campo-tiempo:last-child {
            margin-bottom: 0;
        }

        label {
            font-weight: 600;
            font-size: 0.9em;
            color: var(--tierra-media);
        }

        input[type="time"] {
            padding: 8px 12px;
            border: 2px solid #e0d8c3;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            color: var(--tierra-oscura);
            font-weight: 600;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="time"]:focus {
            border-color: var(--verde-planta);
        }

        /* Botón de acción con degradado */
        button {
            background: linear-gradient(135deg, var(--azul-claro), var(--azul-agua));
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05em;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 136, 209, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.5);
            background: linear-gradient(135deg, #4FC3F7, #0277BD);
        }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>🌱 Panel de Riego Inteligente</h1>
        <p class="subtitulo">Gestión de tramos horarios automatizados por zona de cultivo</p>
    </div>

    <div class="grid-cultivos">

        <div class="tarjeta-cultivo">
            <img src="https://images.unsplash.com/photo-1592841200221-a6898f307baa?auto=format&fit=crop&w=600&q=80" alt="Tomates rojos" class="imagen-cultivo">
            <div class="contenido-tarjeta">
                <h2>Tomates</h2>
                <div class="control-horario">
                    <div class="campo-tiempo">
                        <label for="inicio-1">Inicio:</label>
                        <input type="time" id="inicio-1" value="08:00">
                    </div>
                    <div class="campo-tiempo">
                        <label for="fin-1">Fin:</label>
                        <input type="time" id="fin-1" value="08:30">
                    </div>
                </div>
                <button onclick="guardarHorario(1, 'Tomates')">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16a6 6 0 0 0 6-6c0-1.655-1.122-2.904-2.432-4.362C10.254 4.176 8.75 2.503 8 0c-.75 2.503-2.254 4.176-3.568 5.638C3.122 7.096 2 8.345 2 10a6 6 0 0 0 6 6z"/></svg>
                    Programar Riego
                </button>
            </div>
        </div>

        <div class="tarjeta-cultivo">
            <img src="https://images.unsplash.com/photo-1598170845058-32b9d6a5da37?auto=format&fit=crop&w=600&q=80" alt="Zanahorias" class="imagen-cultivo">
            <div class="contenido-tarjeta">
                <h2>Zanahorias</h2>
                <div class="control-horario">
                    <div class="campo-tiempo">
                        <label for="inicio-3">Inicio:</label>
                        <input type="time" id="inicio-3" value="07:00">
                    </div>
                    <div class="campo-tiempo">
                        <label for="fin-3">Fin:</label>
                        <input type="time" id="fin-3" value="07:20">
                    </div>
                </div>
                <button onclick="guardarHorario(3, 'Zanahorias')">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16a6 6 0 0 0 6-6c0-1.655-1.122-2.904-2.432-4.362C10.254 4.176 8.75 2.503 8 0c-.75 2.503-2.254 4.176-3.568 5.638C3.122 7.096 2 8.345 2 10a6 6 0 0 0 6 6z"/></svg>
                    Programar Riego
                </button>
            </div>
        </div>

        <div class="tarjeta-cultivo">
            <img src="https://images.unsplash.com/photo-1563565375-f3fdfdbefa83?auto=format&fit=crop&w=600&q=80" alt="Pimientos" class="imagen-cultivo">
            <div class="contenido-tarjeta">
                <h2>Pimientos</h2>
                <div class="control-horario">
                    <div class="campo-tiempo">
                        <label for="inicio-4">Inicio:</label>
                        <input type="time" id="inicio-4" value="20:00">
                    </div>
                    <div class="campo-tiempo">
                        <label for="fin-4">Fin:</label>
                        <input type="time" id="fin-4" value="20:30">
                    </div>
                </div>
                <button onclick="guardarHorario(4, 'Pimientos')">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16a6 6 0 0 0 6-6c0-1.655-1.122-2.904-2.432-4.362C10.254 4.176 8.75 2.503 8 0c-.75 2.503-2.254 4.176-3.568 5.638C3.122 7.096 2 8.345 2 10a6 6 0 0 0 6 6z"/></svg>
                    Programar Riego
                </button>
            </div>
        </div>

    </div>

    <script>
        function guardarHorario(idCultivo, nombreCultivo) {
            let horaInicio = document.getElementById('inicio-' + idCultivo).value;
            let horaFin = document.getElementById('fin-' + idCultivo).value;

            if (!horaInicio || !horaFin) {
                alert('Por favor, selecciona una hora de inicio y una hora de fin para ' + nombreCultivo + '.');
                return;
            }

            alert('✅ ¡Sistema actualizado!\nEl riego para ' + nombreCultivo + ' está programado desde las ' + horaInicio + ' hasta las ' + horaFin + '.');
        }
    </script>
</body>
</html>
