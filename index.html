<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maristas-Córdoba Debate | Temporizador Equipos A/B Alterno</title>
  <style>
    :root{
      --magenta:#c5007e;
      --azul:#001489;
      --blanco:#ffffff;
      --bg1:#f8f9ff;
      --bg2:#ffffff;
      --shadow: 0 18px 40px rgba(0,20,137,.12), 0 8px 18px rgba(197,0,126,.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(197,0,126,.10), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(0,20,137,.12), transparent 42%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--azul);
    }

    body {
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 12px;
    }

    .app {
      width: min(1500px, 98vw);
      min-height: min(95vh, 980px);
      background: var(--blanco);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 2px solid rgba(0,20,137,.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* --- CABECERA --- */
    .top-bar {
      display:flex;
      align-items:center;
      justify-content: flex-end;
      padding: 10px 20px;
      background: linear-gradient(135deg, rgba(0,20,137,.03), rgba(197,0,126,.04));
      border-bottom: 1px solid rgba(0,20,137,.08);
    }

    .top-bar button {
      border:none;
      border-radius: 12px;
      padding: .6rem 1rem;
      font-weight: 700;
      cursor:pointer;
      background: var(--azul);
      color: white;
      transition: transform .12s ease;
      font-size: .95rem;
    }
    .top-bar button:active { transform: scale(.95); }

    .brand-header {
      display:flex;
      flex-direction:column;
      align-items:center;
      padding: 15px 16px 5px;
    }

    .center-logo {
      height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,20,137,.10));
    }

    .brand-title {
      margin: 8px 0 0;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--azul);
      text-transform: uppercase;
    }

    /* --- CONTENIDO CENTRAL --- */
    .content {
      flex: 1;
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .role {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--azul);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0,20,137,.05);
      padding: 6px 20px;
      border-radius: 50px;
    }

    /* TEMPORIZADOR SÚPER GRANDE */
    .timer-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .timer {
      width: min(1000px, 95%);
      border-radius: 32px;
      color: white;
      background: linear-gradient(135deg, var(--azul), #1a2fc2);
      border: 4px solid rgba(197,0,126,.18);
      box-shadow: 0 16px 34px rgba(0,20,137,.2);
      padding: 20px 30px;
      text-align: center;
      transition: all .25s ease;
    }

    .timer.team-a {
      background: linear-gradient(135deg, var(--magenta), #a8006b);
      border-color: rgba(197,0,126,.45);
      box-shadow: 0 16px 34px rgba(197,0,126,.25);
    }
    .timer.team-b {
      border-color: rgba(255,255,255,.35);
    }

    .timer.negative {
      background: #e63946;
      animation: pulseExcess 1s infinite ease-in-out;
    }

    @keyframes pulseExcess {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .progress {
      height: 10px;
      width: 100%;
      background: rgba(255,255,255,.2);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 15px;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: white;
      border-radius: 999px;
      transition: width .18s linear;
    }

    .time {
      font-size: clamp(6rem, 18vw, 13rem); /* Ajustado para que no se salga */
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
      margin: 0;
      white-space: nowrap; /* Evita que los números bajen de línea */
    }

    .status {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* BOTONES DE TURNOS Y REPRODUCCIÓN */
    .buttons-grid {
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      width: min(1000px, 95%);
      margin-top: 10px;
    }

    button.role-btn {
      border: 2px solid rgba(0,20,137,.14);
      border-radius: 16px;
      background: white;
      color: var(--azul);
      padding: 1rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,20,137,.05);
      transition: all .15s ease;
    }

    button.role-btn:hover { border-color: var(--azul); transform: translateY(-2px); }
    button.role-btn.active {
      border-color: var(--magenta);
      color: white;
      background: var(--magenta);
      box-shadow: 0 8px 16px rgba(197,0,126,.2);
    }

    .controls-main {
      display:flex;
      gap: 12px;
      margin-top: 5px;
      width: min(1000px, 95%);
      justify-content: center;
    }

    .controls-main button {
      border: none;
      border-radius: 12px;
      padding: .8rem 1.5rem;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      background: var(--azul);
      color: white;
      box-shadow: 0 6px 14px rgba(0,20,137,.15);
      transition: transform .12s ease;
    }
    .controls-main button.secondary {
      background: #eef2ff;
      color: var(--azul);
      border: 2px solid var(--azul);
      box-shadow: none;
    }
    .controls-main button.danger {
      background: white;
      color: #e63946;
      border: 2px solid #ffccd0;
    }
    .controls-main button:active { transform: scale(.95); }

    /* --- PANEL INFERIOR: EQUIPOS Y AUTOMATIZACIÓN --- */
    .settings-panel {
      background: rgba(0,20,137,.03);
      border-top: 2px solid rgba(0,20,137,.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .settings-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--azul);
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0;
    }

    .settings-grid {
      display: flex;
      gap: 30px;
      width: min(1000px, 95%);
      justify-content: center;
      flex-wrap: wrap;
    }

    .settings-col {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .settings-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .team-btn, .auto-btn {
      flex: 1;
      border: 2px solid rgba(0,20,137,.14);
      background: white;
      color: var(--azul);
      border-radius: 12px;
      padding: .8rem;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all .15s ease;
      text-align: center;
    }

    .team-btn.active-a { border-color: var(--magenta); color: white; background: var(--magenta); }
    .team-btn.active-b { border-color: var(--azul); color: white; background: var(--azul); }
    
    .auto-btn:hover { border-color: var(--magenta); }
    .auto-btn.active-mode { background: var(--azul); color: white; border-color: var(--azul); }

    .round-info {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--magenta);
      background: white;
      padding: 6px 15px;
      border-radius: 50px;
      border: 1px solid rgba(197,0,126,.2);
      margin-top: 10px;
    }

    /* --- FOOTER --- */
    .credits {
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--azul);
      opacity: 0.8;
      background: white;
    }

    /* FULLSCREEN ADAPTATIONS */
    :fullscreen .app { width: 100vw; height: 100vh; max-width: none; border-radius: 0; border: none; }
    :fullscreen .time { font-size: clamp(8rem, 22vw, 18rem); }
    
    @media (max-width: 800px) {
      .buttons-grid { grid-template-columns: 1fr 1fr; }
      .controls-main { flex-wrap: wrap; }
      .controls-main button { flex: 1 1 40%; }
      .settings-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    
    <header class="top-bar">
      <button id="fullscreenBtn">⤢ Pantalla completa</button>
    </header>

    <section class="brand-header">
      <img src="logo-maristas.png" alt="Logo Maristas" class="center-logo" onerror="this.style.display='none'" />
      <h1 class="brand-title">MARISTAS CÓRDOBA | DEBATE</h1>
    </section>

    <section class="content">
      
      <div class="role" id="roleLabel">SELECCIONA EQUIPO Y TURNO</div>

      <div class="timer-wrap">
        <div class="timer team-a" id="timerBox">
          <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
          <div class="time" id="timeDisplay">00:00</div>
          <div class="status" id="statusText">Listo</div>
        </div>
      </div>

      <div class="buttons-grid">
        <button class="role-btn" data-label="Introductor" data-seconds="180">INTRO (3')</button>
        <button class="role-btn" data-label="Refutador 1" data-seconds="240">REF 1 (4')</button>
        <button class="role-btn" data-label="Refutador 2" data-seconds="240">REF 2 (4')</button>
        <button class="role-btn" data-label="Conclusor" data-seconds="180">CONCLU (3')</button>
      </div>

      <div class="controls-main">
        <button id="pauseBtn" class="secondary">⏸ Pausar</button>
        <button id="resumeBtn">▶ Reanudar</button>
        <button id="resetBtn" class="secondary">🔄 Reiniciar</button>
        <button id="stopBtn" class="danger">⏹ Detener</button>
      </div>
      
    </section>

    <section class="settings-panel">
      <h3 class="settings-title">Configuración de Equipos y Automatización</h3>
      
      <div class="settings-grid">
        <div class="settings-col">
          <div class="settings-row">
            <button class="team-btn active-a" id="selectTeamA">EQUIPO A</button>
            <button class="team-btn" id="selectTeamB">EQUIPO B</button>
          </div>
        </div>
        
        <div class="settings-col">
          <div class="settings-row">
            <button id="startAutoBtn" class="auto-btn">▶ Ronda Simple</button>
            <button id="startFullDebateBtn" class="auto-btn">▶ Debate Alterno (A ↔ B)</button>
          </div>
        </div>
      </div>
      
      <div class="round-info" id="roundInfo">Ronda automática: desactivada</div>
    </section>

    <footer class="credits">
      <strong>Autor:</strong> JUAN ANTONIO MUÑOZ CRUZ | Atajos: [F] Pantalla completa · [Espacio] Pausa/Play · [T] Cambiar Equipo · [1-4] Turnos
    </footer>

  </main>

  <script>
    /* EL CÓDIGO JS SE MANTIENE EXACTAMENTE IGUAL A TU LÓGICA ORIGINAL */
    const BASE_TURNS = [
      { role: "Introductor", seconds: 180 },
      { role: "Refutador 1", seconds: 240 },
      { role: "Refutador 2", seconds: 240 },
      { role: "Conclusor", seconds: 180 }
    ];

    const app = document.getElementById("app");
    const timeDisplay = document.getElementById("timeDisplay");
    const roleLabel = document.getElementById("roleLabel");
    const statusText = document.getElementById("statusText");
    const timerBox = document.getElementById("timerBox");
    const progressFill = document.getElementById("progressFill");
    const roundInfo = document.getElementById("roundInfo");

    const roleButtons = Array.from(document.querySelectorAll(".role-btn"));

    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const resetBtn = document.getElementById("resetBtn");
    const stopBtn = document.getElementById("stopBtn");

    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const startAutoBtn = document.getElementById("startAutoBtn");
    const startFullDebateBtn = document.getElementById("startFullDebateBtn");

    const selectTeamA = document.getElementById("selectTeamA");
    const selectTeamB = document.getElementById("selectTeamB");

    let intervalId = null;
    let endTimestamp = null;
    let currentDuration = 0;
    let currentRole = "";
    let currentTeam = "A";
    let paused = false;
    let pausedRemainingMs = 0;

    let justFinishedMainTime = false;
    let lastWholeSecond = null;

    let autoMode = false;          
    let fullDebateMode = false;    
    let autoRunning = false;
    let autoSequence = [];
    let autoIndex = 0;

    function pad(n) { return String(n).padStart(2, "0"); }

    function formatSignedTime(totalSeconds) {
      const isNeg = totalSeconds < 0;
      const abs = Math.abs(totalSeconds);
      const mins = Math.floor(abs / 60);
      const secs = abs % 60;
      return `${isNeg ? "-" : ""}${pad(mins)}:${pad(secs)}`;
    }

    function setRoleLabel(text) {
      roleLabel.textContent = text;
    }

    function updateActiveButton(activeBtn) {
      roleButtons.forEach(btn => btn.classList.remove("active"));
      if (activeBtn) activeBtn.classList.add("active");
    }

    function findButtonByRole(roleName) {
      return roleButtons.find(btn => btn.dataset.label === roleName) || null;
    }

    function clearTimerInterval() {
      clearInterval(intervalId);
      intervalId = null;
    }

    function updateProgress(remainingSeconds) {
      if (!currentDuration || remainingSeconds < 0) {
        progressFill.style.width = remainingSeconds < 0 ? "100%" : "0%";
        return;
      }
      const elapsed = currentDuration - remainingSeconds;
      const pct = Math.max(0, Math.min(100, (elapsed / currentDuration) * 100));
      progressFill.style.width = pct + "%";
    }

    function setCurrentTeam(team) {
      currentTeam = team === "B" ? "B" : "A";

      selectTeamA.classList.toggle("active-a", currentTeam === "A");
      selectTeamB.classList.toggle("active-b", currentTeam === "B");

      timerBox.classList.toggle("team-a", currentTeam === "A");
      timerBox.classList.toggle("team-b", currentTeam === "B");
      
      if(!autoRunning && currentRole) {
         setRoleLabel(`Equipo ${currentTeam} · ${currentRole}`);
      }
    }

    function buildSimpleRoundSequence(team) {
      return BASE_TURNS.map(t => ({ team, role: t.role, seconds: t.seconds }));
    }

    function buildAlternatingDebateSequence() {
      const seq = [];
      for (const t of BASE_TURNS) {
        seq.push({ team: "A", role: t.role, seconds: t.seconds });
        seq.push({ team: "B", role: t.role, seconds: t.seconds });
      }
      return seq;
    }

    function updateModeButtonsUI() {
      startAutoBtn.classList.toggle("active-mode", autoMode);
      startFullDebateBtn.classList.toggle("active-mode", fullDebateMode);
    }

    function updateRoundInfo() {
      if (!autoRunning) {
        if (fullDebateMode) {
          roundInfo.textContent = "Modo debate alterno A/B activado";
        } else if (autoMode) {
          roundInfo.textContent = `Ronda automática simple activada (Equipo ${currentTeam})`;
        } else {
          roundInfo.textContent = "Modo Manual";
        }
        return;
      }

      const total = autoSequence.length;
      const currentNum = Math.min(autoIndex + 1, total);
      const step = autoSequence[Math.min(autoIndex, total - 1)];
      roundInfo.textContent = `Automático en curso · ${currentNum}/${total} · Equipo ${step.team} · ${step.role}`;
    }

    function handleAutoAdvanceIfNeeded(diffSeconds) {
      if (autoRunning && diffSeconds < 0 && !justFinishedMainTime) {
        justFinishedMainTime = true;

        setTimeout(() => {
          if (!autoRunning) return;

          autoIndex++;
          if (autoIndex < autoSequence.length) {
            const next = autoSequence[autoIndex];
            setCurrentTeam(next.team);
            startTimer(next.seconds, next.role, findButtonByRole(next.role), true);
          } else {
            clearTimerInterval();
            autoRunning = false;
            setRoleLabel("DEBATE FINALIZADO");
            statusText.textContent = "Fin";
            timerBox.classList.remove("negative");
            updateModeButtonsUI();
            updateRoundInfo();
          }
        }, 1100);
      }
    }

    function updateTimer() {
      const now = Date.now();
      const diffMs = endTimestamp - now;
      const diffSeconds = Math.ceil(diffMs / 1000);

      timeDisplay.textContent = formatSignedTime(diffSeconds);
      updateProgress(diffSeconds);

      lastWholeSecond = diffSeconds;

      if (diffSeconds >= 0) {
        timerBox.classList.remove("negative");
        statusText.textContent = diffSeconds === 0 ? "TIEMPO AGOTADO" : "EN CURSO";
      } else {
        timerBox.classList.add("negative");
        statusText.textContent = "TIEMPO EXCEDIDO";
      }

      if (!autoRunning && diffSeconds < 0 && !justFinishedMainTime) {
        justFinishedMainTime = true;
      }

      handleAutoAdvanceIfNeeded(diffSeconds);
    }

    function startTimer(seconds, roleName, btnRef = null, fromAuto = false) {
      clearTimerInterval();

      currentDuration = seconds;
      currentRole = roleName;
      paused = false;
      pausedRemainingMs = 0;
      justFinishedMainTime = false;
      lastWholeSecond = null;

      endTimestamp = Date.now() + seconds * 1000;

      setRoleLabel(`Equipo ${currentTeam} · ${roleName}`);
      timerBox.classList.remove("negative");
      updateActiveButton(btnRef);

      updateTimer();
      intervalId = setInterval(updateTimer, 150);
      updateRoundInfo();
    }

    function pauseTimer() {
      if (!intervalId || paused) return;
      pausedRemainingMs = endTimestamp - Date.now();
      clearTimerInterval();
      paused = true;
      statusText.textContent = "PAUSADO";
    }

    function resumeTimer() {
      if (!paused) return;
      endTimestamp = Date.now() + pausedRemainingMs;
      paused = false;
      statusText.textContent = "EN CURSO";
      updateTimer();
      intervalId = setInterval(updateTimer, 150);
    }

    function resetCurrentTurn() {
      if (!currentDuration || !currentRole) return;
      const activeBtn = findButtonByRole(currentRole);
      startTimer(currentDuration, currentRole, activeBtn, autoRunning);
    }

    function stopAll() {
      clearTimerInterval();
      paused = false;
      pausedRemainingMs = 0;
      autoRunning = false;
      autoMode = false;
      fullDebateMode = false;
      justFinishedMainTime = false;
      lastWholeSecond = null;
      autoSequence = [];
      autoIndex = 0;

      timeDisplay.textContent = "00:00";
      statusText.textContent = "DETENIDO";
      setRoleLabel("SELECCIONA EQUIPO Y TURNO");
      timerBox.classList.remove("negative");
      progressFill.style.width = "0%";
      updateActiveButton(null);
      updateModeButtonsUI();
      updateRoundInfo();
    }

    function startAutoRoundSimple() {
      autoMode = true; fullDebateMode = false; autoRunning = true;
      autoSequence = buildSimpleRoundSequence(currentTeam);
      autoIndex = 0;
      updateModeButtonsUI(); updateRoundInfo();
      const first = autoSequence[0];
      setCurrentTeam(first.team);
      startTimer(first.seconds, first.role, findButtonByRole(first.role), true);
    }

    function startAlternatingDebateAB() {
      fullDebateMode = true; autoMode = false; autoRunning = true;
      autoSequence = buildAlternatingDebateSequence();
      autoIndex = 0;
      updateModeButtonsUI(); updateRoundInfo();
      const first = autoSequence[0];
      setCurrentTeam(first.team);
      startTimer(first.seconds, first.role, findButtonByRole(first.role), true);
    }

    async function toggleFullscreen() {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    }

    selectTeamA.addEventListener("click", () => { setCurrentTeam("A"); if (!autoRunning) updateRoundInfo(); });
    selectTeamB.addEventListener("click", () => { setCurrentTeam("B"); if (!autoRunning) updateRoundInfo(); });

    roleButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const seconds = parseInt(btn.dataset.seconds, 10);
        autoRunning = false; autoMode = false; fullDebateMode = false; updateModeButtonsUI();
        startTimer(seconds, btn.dataset.label, btn, false);
      });
    });

    pauseBtn.addEventListener("click", pauseTimer);
    resumeBtn.addEventListener("click", resumeTimer);
    resetBtn.addEventListener("click", resetCurrentTurn);
    stopBtn.addEventListener("click", stopAll);
    startAutoBtn.addEventListener("click", startAutoRoundSimple);
    startFullDebateBtn.addEventListener("click", startAlternatingDebateAB);
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "f") { e.preventDefault(); toggleFullscreen(); }
      else if (key === " ") { e.preventDefault(); paused ? resumeTimer() : pauseTimer(); }
      else if (key === "r") { e.preventDefault(); resetCurrentTurn(); }
      else if (key === "s") { e.preventDefault(); stopAll(); }
      else if (key === "t") { e.preventDefault(); setCurrentTeam(currentTeam === "A" ? "B" : "A"); }
      else if (["1","2","3","4"].includes(key)) {
        e.preventDefault();
        const btn = roleButtons[parseInt(key, 10) - 1];
        if (btn) btn.click();
      }
    });

    setCurrentTeam("A");
    updateRoundInfo();
  </script>
</body>
</html>
